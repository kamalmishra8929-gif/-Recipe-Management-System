{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'recipe.css' %}">
</head>
<body>

<form class="col-6 mx-auto card p-3 shadow-lg" style="width: 50%; margin: 80px auto;" method="post">
    {% csrf_token %}

  <h2>REGISTER</h2>

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }}" role="alert">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}
    <div class="mb-3">
        <label class="form-label">First Name</label>
        <input required type="text" name="first_name" class="form-control">
    </div><br>

    <div class="mb-3">
        <label class="form-label">Last Name</label>
        <input required type="text" name="last_name" class="form-control">
    </div><br>

    <div class="mb-3">
        <label class="form-label">Username</label>
        <input required type="text" name="username" class="form-control">
    </div><br>

    <div class="mb-3">
        <label class="form-label">Password</label>
        <input required type="password" name="password" class="form-control">
    </div><br>

    <button type="submit" class="btn btn-primary">REGISTER</button>
    <p>Already have an account? <a href="/login/">Login</a></p>
</form>

</body>
</html>
